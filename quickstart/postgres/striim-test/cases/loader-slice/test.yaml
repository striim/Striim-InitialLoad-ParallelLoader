name: loader-slice
purpose: Run one slice app built from the ParallelLoader TQL template on Postgres and compare the target exactly with that slice's rows
tql: app.tql
topology: single
requires: [postgres]
timeout: 180
tags: [quickstart, initial-load, postgres, exact]
ddl:
  - file: ddl_source.sql
    db: postgres-source
  - file: ddl_target.sql
    db: postgres-target
seed:
  - file: seed.sql
    db: postgres-source
    when: pre_deploy
exact: {version: 1, max_rows: 100}
assert:
  smoke: true
  data:
    - target: "${PG_TARGET_SCHEMA}.${TID}tgt"
      target_db: postgres-target
      match: expected/rows.csv
      exact:
        columns: {id: integer, amount: "decimal:2", created_at: timestamp}
lifecycle:
  version: 1
  mode: initial-load
  sink: db
  readiness:
    kind: baseline-landed
    # ${TID}slice holds exactly the slice's rows, so its count is the expected target count.
    source: {db: postgres-source, table: "${PG_SOURCE_SCHEMA}.${TID}slice"}
    target: {db: postgres-target, table: "${PG_TARGET_SCHEMA}.${TID}tgt"}
  completion:
    kind: row-count
    db: postgres-target
    table: "${PG_TARGET_SCHEMA}.${TID}tgt"
    expect: 25
  stability: 2s
  deadlines: {readiness: 90s, completion: 120s}
  reset: owned
